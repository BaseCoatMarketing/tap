<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mark This Lead</title>
<style>
  :root { --bg: #f6f4ef; --card: #ffffff; --ink: #1f2a2e; --muted: #5d686c; --line: #e2ded4; --good: #1d6b57; --bad: #8a3a2c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15191b; --card: #1f2528; --ink: #eef1f2; --muted: #a4adb1; --line: #333b3f; --good: #3aa487; --bad: #cf6f5e; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 32px 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px 20px; }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 6px; }
  p { margin: 0 0 18px; color: var(--muted); }
  button { display: block; width: 100%; min-height: 56px; padding: 12px 16px; margin-top: 10px; border: 0; border-radius: 10px; font: 600 17px/1.2 inherit; font-family: inherit; color: #fff; cursor: pointer; }
  #booked { background: var(--good); }
  #junk { background: var(--bad); }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  #note { margin: 16px 0 0; font-size: 15px; }
  #note[data-kind="saved"] { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1 id="title">Did this lead book?</h1>
    <p id="sub">Your answer updates this lead in the CRM.</p>
    <div id="buttons">
      <button id="booked" type="button">Booked an estimate</button>
      <button id="junk" type="button">Not a real lead</button>
    </div>
    <p id="note" role="status" aria-live="polite"></p>
  </div>
</main>
<script>
(function () {
  var ENDPOINT = "https://iqxqmvkyppwlqsvafewm.supabase.co/functions/v1/lead-tap";
  var q = new URLSearchParams(location.search);
  var link = { l: q.get("l") || "", k: q.get("k") || "", c: q.get("c") || "" };
  var buttons = [document.getElementById("booked"), document.getElementById("junk")];
  var title = document.getElementById("title");
  var sub = document.getElementById("sub");
  var note = document.getElementById("note");
  var name = "this lead";

  function say(text, kind) { note.textContent = text; note.dataset.kind = kind || ""; }
  function lock(on) { buttons.forEach(function (b) { b.disabled = on; }); }
  function dead(text) { lock(true); document.getElementById("buttons").hidden = true; title.textContent = "This link doesn't work"; sub.textContent = text; }

  if (!link.l || !link.k || !link.c) { dead("Open it from the lead alert email."); return; }

  fetch(ENDPOINT + "?" + new URLSearchParams(link).toString())
    .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
    .then(function (x) {
      if (!x.ok) { dead("Open it from the lead alert email."); return; }
      name = x.b.name;
      title.textContent = "Did " + name + " book?";
    })
    .catch(function () { /* the buttons still work, only the name is missing */ });

  function tap(outcome) {
    lock(true);
    say("Saving...");
    fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ l: link.l, k: link.k, c: link.c, o: outcome }) })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
      .then(function (x) {
        lock(false);
        if (!x.ok) { say("That didn't save. Please try once more."); return; }
        if (x.b.result === "kept") { say("No change, " + name + " is already past this stage.", "saved"); return; }
        say(outcome === "booked" ? "Saved: " + name + " booked an estimate. Picked wrong? Tap the other button." : "Saved: not a real lead. Picked wrong? Tap the other button.", "saved");
      })
      .catch(function () { lock(false); say("That didn't save. Please try once more."); });
  }
  buttons[0].addEventListener("click", function () { tap("booked"); });
  buttons[1].addEventListener("click", function () { tap("junk"); });
})();
</script>
</body>
</html>
